# 密钥泄露扫描（gitleaks）— P0-2 安全加固
# 每次 push / PR 扫描全量历史，防止真实凭据再次误提交。
name: secret-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
