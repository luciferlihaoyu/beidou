services:
  beidou:
    build: .
    ports:
      - "3000:3000"
    environment:
      # 生产环境务必修改
      SECRET_KEY: ${SECRET_KEY:-please-change-me-to-a-long-random-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - beidou-data:/data
    restart: unless-stopped

volumes:
  beidou-data:
